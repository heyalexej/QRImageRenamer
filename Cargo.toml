[package]
name = "qr_image_renamer"
version = "0.1.2"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.31", features = ["derive"] }
chrono = "0.4.43"
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
minijinja = "2.15.1"
natord = "1.0.9"
nom-exif = "2.7.0"
rayon = "1.10.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.11"
walkdir = "2.5.0"
zxing-cpp = { version = "0.4.1", features = ["bundled"] }

[[bin]]
name = "qrir"
path = "src/main.rs"
